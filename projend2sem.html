<!DOCTYPE html>
<html>
<head>
    <title>Even Odd Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 30px;
            width: 300px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        #result {
            margin-top: 20px;
            color: #333;
            font-size: 20px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>Even or Odd Checker</h2>

        <input type="number" id="num" placeholder="Enter Number">

        <button onclick="checkNumber()">Check</button>

        <h3 id="result"></h3>

    </div>


    <script>

        function checkNumber() {

            let number = document.getElementById("num").value;

            if (number === "") {
                document.getElementById("result").innerHTML = "Enter a number";
            }

            else if (number % 2 === 0) {
                document.getElementById("result").innerHTML = "Even Number ✅";
            }

            else {
                document.getElementById("result").innerHTML = "Odd Number 🔢";
            }

        }

    </script>

</body>
</html>
