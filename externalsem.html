<!DOCTYPE html>
<html>
<head>
    <title>My Restaurant</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
            background-color: white;
        }

        header {
            background-color: brown;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: black;
            text-align: center;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section {
            padding: 20px;
            text-align: center;
        }

        .menu-item {
            background: white;
            margin: 10px auto;
            padding: 10px;
            width: 300px;
            border-radius: 5px;
        }

        footer {
            background-color: brown;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome to Tasty Restaurant</h1>
    <p>Delicious Food Everyday</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">Contact</a>
</nav>

<section>
    <h2>Our Menu</h2>

    <div class="menu-item">
        <h3>Pizza</h3>
        <p>Price: ₹199</p>
    </div>

    <div class="menu-item">
        <h3>Burger</h3>
        <p>Price: ₹99</p>
    </div>

    <div class="menu-item">
        <h3>Pasta</h3>
        <p>Price: ₹149</p>
    </div>
</section>

<footer>
    <p>© 2026 Tasty Restaurant | All Rights Reserved</p>
</footer>

</body>
</html>
